name: Apply V0.20.5 Startup Cache Hotfix

on:
  push:
    branches:
      - hotfix/v0.20.5-startup-cache
    paths:
      - .github/workflows/v0205-apply.yml

permissions:
  contents: write

jobs:
  apply-verify-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v0.20.5-startup-cache
      - name: Apply bounded startup cache hotfix
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace(path, old, new, count=None):
              p=Path(path); s=p.read_text()
              if old not in s:
                  raise SystemExit(f'missing expected text in {path}: {old}')
              s=s.replace(old,new) if count is None else s.replace(old,new,count)
              p.write_text(s)

          replace('assets/js/app.js','from "./storage.js";','from "./storage.js?v=0.20.5";',1)
          replace('assets/js/app.js','?v=0.20.4','?v=0.20.5')
          replace('index.html','0.20.4','0.20.5')
          for path in ['assets/js/analytics.js','assets/js/backup-restore.js']:
              replace(path,'?v=0.20.4','?v=0.20.5')
          replace('assets/js/update-manager.js','0.20.4','0.20.5')
          replace('README.md','# Digilians E-Learn Platform V0.20.4','# Digilians E-Learn Platform V0.20.5',1)
          Path('VERSION.txt').write_text('0.20.5\nRelease: Startup Cache Compatibility Hotfix\nDate: 2026-08-30\n')

          p=Path('data/changelog.json'); data=json.loads(p.read_text())
          data['latest']='0.20.5'
          if not any(str(x.get('version'))=='0.20.5' for x in data.get('releases',[])):
              data.setdefault('releases',[]).insert(0,{
                'version':'0.20.5',
                'title':'Startup Cache Compatibility Hotfix',
                'date':'2026-08-30','type':'fix',
                'summary':'Prevents browsers from mixing a new app module with a stale cached storage module during startup.',
                'highlights':[
                  'Versioned the startup-critical storage.js import so V0.20.5 always loads the matching storage API.',
                  'Prevents the V0.20.4 startup failure when a cached V0.20.3 storage module lacks clearOfficialMistakeFlags.',
                  'Reset My Mistakes behavior and all learner results, Ranking, Study progress and assessment content remain unchanged.'
                ]
              })
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Verify hotfix
        run: |
          node --test tests/startup-cache.test.mjs tests/reset-mistakes.test.mjs
          node --check assets/js/app.js
          node --check assets/js/storage.js
          node --check assets/js/mistakes.js
          node --check assets/js/update-manager.js
          grep -q 'from "./storage.js?v=0.20.5";' assets/js/app.js
          test "$(head -n1 VERSION.txt)" = "0.20.5"
          ! git diff --name-only HEAD | grep -E '^(question-banks|official-qbank|exams)/'
      - name: Commit hotfix
        run: |
          git config user.name "Ahmed Khaled"
          git config user.email "ahmedkph97@gmail.com"
          git add README.md VERSION.txt index.html assets/js/app.js assets/js/analytics.js assets/js/backup-restore.js assets/js/update-manager.js data/changelog.json
          git commit -m "Hotfix V0.20.5 — Startup Cache Compatibility"
          git push origin hotfix/v0.20.5-startup-cache
