name: Apply V0.20.3 Learn Coverage Hotfix

on:
  push:
    branches:
      - hotfix/v0.20.3-learn-coverage
    paths:
      - '.github/workflows/v0203-hotfix.yml'

permissions:
  contents: write

jobs:
  apply-verify-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: hotfix/v0.20.3-learn-coverage
          fetch-depth: 0

      - name: Reconstruct and apply hotfix
        shell: bash
        run: |
          set -euo pipefail
          tr -d '\n\r' < .github/v0203-hotfix/payload.b64 | base64 -d > /tmp/v0203.patch.xz
          xz -dc /tmp/v0203.patch.xz > /tmp/v0203.patch
          echo '68029ab10e8c49fca35e403298353036150df9aeb7c70404c310bdef6694221e  /tmp/v0203.patch' | sha256sum -c -
          git apply --check /tmp/v0203.patch
          git apply /tmp/v0203.patch

      - name: Verify hotfix scope and regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, re, subprocess, sys
          expected={
            'README.md','VERSION.txt','index.html','assets/js/analytics.js','assets/js/app.js',
            'assets/js/backup-restore.js','assets/js/update-manager.js','data/changelog.json'
          }
          changed=set(subprocess.check_output(['git','diff','--name-only','HEAD'],text=True).splitlines())
          if changed != expected:
              raise SystemExit(f'Unexpected hotfix scope: {sorted(changed)}')
          version=pathlib.Path('VERSION.txt').read_text(encoding='utf-8').splitlines()[0].strip()
          if version!='0.20.3': raise SystemExit(f'Bad VERSION: {version}')
          app=pathlib.Path('assets/js/app.js').read_text(encoding='utf-8')
          unsafe='topic.importance.toUpperCase()'
          safe='topic.importance ? String(topic.importance).toUpperCase() : "MAPPED"'
          if unsafe in app: raise SystemExit('Unsafe Learn coverage uppercase call remains')
          if safe not in app: raise SystemExit('Safe Learn coverage fallback missing')
          syllabus=json.loads(pathlib.Path('data/syllabus-maps/excel.json').read_text(encoding='utf-8'))
          if not any(not t.get('importance') for t in syllabus.get('topics',[])):
              raise SystemExit('Regression fixture missing: expected optional importance metadata')
          changelog=json.loads(pathlib.Path('data/changelog.json').read_text(encoding='utf-8'))
          if changelog.get('latest')!='0.20.3': raise SystemExit('Changelog latest mismatch')
          if not any(r.get('version')=='0.20.3' for r in changelog.get('releases',[])):
              raise SystemExit('V0.20.3 changelog entry missing')
          index=pathlib.Path('index.html').read_text(encoding='utf-8')
          for token in ['data-build-version="0.20.3"','assets/js/app.js?v=0.20.3','assets/js/update-manager.js?v=0.20.3']:
              if token not in index: raise SystemExit(f'Missing cache/version token: {token}')
          print('PASS: scope = 8 production files')
          print('PASS: Learn coverage optional importance fallback = MAPPED')
          print('PASS: version/changelog/cache metadata = 0.20.3')
          PY

      - name: Commit verified hotfix
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/v0203-hotfix
          rm -f .github/workflows/v0203-hotfix.yml
          git config user.name 'Ahmed Khaled'
          git config user.email 'ahmedkph97@gmail.com'
          git add -A
          git commit -m 'Hotfix V0.20.3 Learn coverage optional metadata'
          git push origin HEAD:hotfix/v0.20.3-learn-coverage
