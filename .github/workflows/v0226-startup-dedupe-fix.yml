name: V0.22.6 Startup Dedupe Fix Bot

on:
  push:
    branches:
      - feature/v0.22.6-pl300-learning-ux

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.22.6-pl300-learning-ux
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove redundant full-ranked bootstrap calls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('assets/js/app.js')
          text=path.read_text()
          old='''    await ensurePl300FullRankedLearning();\n    await ensurePl300LearningLoop();\n    await ensurePl300LearningController();\n    await loadVoucherFullRankedIndex(config);'''
          new='''    await ensurePl300FullRankedLearning();\n    await loadVoucherFullRankedIndex(config);'''
          if text.count(old)!=1:
              raise SystemExit(f'expected one redundant bootstrap block, found {text.count(old)}')
          path.write_text(text.replace(old,new,1))
          PY
      - name: Verify bootstrap regression and startup budget
        run: |
          node --check assets/js/app.js
          node --test tests/v0226-pl300-controller-regressions.test.mjs tests/platform-ux-performance.test.mjs
      - name: Commit startup dedupe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/app.js
          git diff --cached --check
          git commit -m "perf: dedupe PL-300 lazy bootstrap"
          git push origin HEAD:feature/v0.22.6-pl300-learning-ux
