name: V0.20.6 Excel Week 3 Production Rerun

on:
  push:
    branches:
      - feature/v0.20.6-excel-week3-study
    paths:
      - .github/workflows/v0206-production-rerun.yml

permissions:
  contents: write

jobs:
  produce-verify-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.20.6-excel-week3-study
      - name: Extract current production generator
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          y=Path('.github/workflows/v0206-week3-production.yml').read_text()
          m=re.search(r"cat > /tmp/produce_week3\.py <<'PY'\n(.*?)\n          PY\n          python /tmp/produce_week3\.py",y,re.S)
          if not m: raise SystemExit('generator block not found')
          lines=[line[10:] if line.startswith('          ') else line for line in m.group(1).splitlines()]
          Path('/tmp/produce_week3.py').write_text('\n'.join(lines)+'\n')
          PY
      - name: Produce Week 3
        run: python /tmp/produce_week3.py
      - name: Verify production and protected baselines
        run: |
          node --test tests/excel-week3-study.test.mjs tests/reset-mistakes.test.mjs tests/startup-cache.test.mjs
          node --check assets/js/app.js
          node --check assets/js/excel-study-render.js
          node --check assets/js/storage.js
          python - <<'PY'
          import json
          from collections import Counter
          for p in ['data/learning.json','data/curriculum/excel.json','data/syllabus-maps/excel.json','data/excel-intake/source-manifest.json','data/excel-intake/week-status.json','data/changelog.json']:
              json.load(open(p,encoding='utf-8'))
          sy=json.load(open('data/syllabus-maps/excel.json',encoding='utf-8'))
          w3=[x for x in sy['topics'] if x.get('week')==3]
          assert Counter(x.get('role') for x in w3)==Counter({'excel-core':86,'supporting':30,'bridge':7})
          assert sum(bool(x.get('assessmentEligible')) for x in w3)==86
          PY
          test "$(head -n1 VERSION.txt)" = "0.20.6"
          grep -q 'storage.js?v=0.20.6' assets/js/app.js
          ! git diff --name-only HEAD | grep -E '^(question-banks|official-qbank|exams)/'
      - name: Commit verified production
        run: |
          git config user.name "Ahmed Khaled"
          git config user.email "ahmedkph97@gmail.com"
          git add README.md VERSION.txt index.html assets/js/app.js assets/js/analytics.js assets/js/backup-restore.js assets/js/update-manager.js data/changelog.json data/learning.json data/curriculum/excel.json data/syllabus-maps/excel.json data/excel-intake/source-manifest.json data/excel-intake/week-status.json docs/excel-production/WEEK-3-FULL-CONTENT-AUDIT.md tests/excel-week3-study.test.mjs
          git commit -m "Release V0.20.6 — Excel Week 3 Study Production"
          git push origin feature/v0.20.6-excel-week3-study
