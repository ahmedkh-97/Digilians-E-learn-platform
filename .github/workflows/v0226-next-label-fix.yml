name: V0.22.6 Next Label Fix Bot

on:
  push:
    branches:
      - feature/v0.22.6-pl300-learning-ux

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.22.6-pl300-learning-ux
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply minimal renderer fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('assets/js/pl300-full-ranked-learning.js')
          text = path.read_text()
          old = '<button type="button" class="primary-btn" id="sourceReviewNext" ${index>=length-1?\'disabled\':\'\'}>Next →</button>'
          new = '<button type="button" class="primary-btn" id="sourceReviewNext" ${index>=length-1?\'disabled\':\'\'}>${htmlEscape(nextActionLabel)}</button>'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one target, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Verify targeted regression
        run: |
          node --check assets/js/pl300-full-ranked-learning.js
          node --test tests/v0226-pl300-next-action-label.test.mjs
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/pl300-full-ranked-learning.js
          git diff --cached --check
          git commit -m "fix: honor PL-300 skip vs next action label"
          git push origin HEAD:feature/v0.22.6-pl300-learning-ux
