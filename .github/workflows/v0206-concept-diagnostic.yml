name: Diagnose Week 3 Concept Counts

on:
  push:
    branches:
      - feature/v0.20.6-excel-week3-study
    paths:
      - .github/workflows/v0206-concept-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.20.6-excel-week3-study
      - name: Extract and count generator specs
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          y=Path('.github/workflows/v0206-week3-production.yml').read_text()
          start=y.index("          import json,re\n")
          end=y.index("          assert len(specs)==34", start)
          block=y[start:end]
          lines=[]
          for line in block.splitlines():
              if line.startswith('          '): line=line[10:]
              lines.append(line)
          code='\n'.join(lines)
          ns={}
          exec(code,ns)
          specs=ns['specs']
          by_group={}
          lessons=[]
          for s in specs:
              n=len(s['concepts'])
              by_group[s['g']]=by_group.get(s['g'],0)+n
              lessons.append({'id':s['id'],'group':s['g'],'count':n,'concepts':s['concepts']})
          out={'total':sum(x['count'] for x in lessons),'byGroup':by_group,'lessons':lessons}
          print(json.dumps(out,ensure_ascii=False,indent=2))
          Path('docs/excel-production/V0206-CONCEPT-DIAGNOSTIC.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit diagnostic
        run: |
          git config user.name "Ahmed Khaled"
          git config user.email "ahmedkph97@gmail.com"
          git add docs/excel-production/V0206-CONCEPT-DIAGNOSTIC.json
          git commit -m "chore: diagnose Week 3 concept counts"
          git push origin feature/v0.20.6-excel-week3-study
