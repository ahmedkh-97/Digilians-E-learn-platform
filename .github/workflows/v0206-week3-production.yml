              notes=[('ENVIRONMENT DEPENDENCY','توفر Power Pivot وخياراته قد يختلف حسب إصدار وترخيص Excel؛ نعرض خطوات المصدر كما هي.')],
              tryit=('بعد استيراد CSV، ما الخيار الذي يربطه بتحليل Power Pivot متعدد الجداول؟','Add this data to the Data Model.'),
