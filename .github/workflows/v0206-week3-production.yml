            ('excel-w3-s02','Lecture 30 Data Visualization with Power Pivot and Excel.pptx',8,'Data Visualization with Power Pivot and Excel'),
            ('excel-w3-s03','Lecture 31 Power Pivot and Advanced Analytics in Excel.pptx',10,'Power Pivot and Advanced Analytics in Excel'),
            ('excel-w3-s04','Lecture 32 Advanced Charts and Data Visualization in Excel - Part 1.pptx',21,'Advanced Charts and Data Visualization in Excel — Part 1'),
            ('excel-w3-s05','Lecture 33 Advanced Charts and Data Visualization in Excel - Part 2.pptx',17,'Advanced Charts and Data Visualization in Excel — Part 2'),
