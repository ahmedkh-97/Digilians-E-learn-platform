              quick=('What does flattening a PivotTable create?',['A new Data Model','A normal values table','A Power View report','A macro'],1,'المصدر يعرّف Flatten بأنه تحويل Pivot output إلى normal values table.'),
              next_text='الخطوة التالية هي إدخال Power Pivot/Data Model بدل الاعتماد على جدول واحد فقط.')
          add('excel-w3-powerpivot-enable-load','Enable Power Pivot & Load Data to the Data Model','17','excel-w3-s01','4,7',
