name: V0.20.6 Excel Week 3 Study Production

on:
  push:
    branches:
      - feature/v0.20.6-excel-week3-study
    paths:
      - .github/workflows/v0206-week3-production.yml

permissions:
  contents: write

jobs:
  produce-verify-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.20.6-excel-week3-study
      - name: Produce Week 3 Study
