          audit='''# Excel Week 3 — Full Content Audit\n\nStatus: **CLOSED / GROUPS APPROVED / STUDY PRODUCED**\n\n## Source batch\n- Lectures 29–38\n- 10 PPTX files\n- 154 slides\n- Final Excel week\n\n## Coverage classification\n- 143 audited source concept clusters\n- 123 non-reuse production concepts\n- 20 reuse-only clusters\n- 86 assessment-eligible concepts\n- 30 supporting / visual / time-sensitive concepts\n- 7 bridge concepts\n\n## Approved learner-facing Groups\n1. PivotTable Mechanics & Power Pivot Entry\n2. Data Models, Relationships & DAX\n3. Model-Driven Dashboards & Power View\n4. Advanced Statistical Visuals in Excel\n5. Geographic & Multi-Dimensional Visuals\n6. Macros & Secure Automation\n7. AI-Assisted Excel & Advanced Analysis\n8. Excel Productivity & Shortcuts\n\n## Locked overlap rules\n- Reuse prior PivotTable/PivotChart/Slicer/Timeline basics; Week 3 adds mechanics and Data Model/Power Pivot layers.\n- Reuse prior chart fundamentals; advanced lessons teach only new construction workflows.\n- Correlation theory stays Statistics prerequisite; Week 3 teaches Excel implementation.\n- Macro Advanced Filter assessment bridges to prior filtering knowledge.\n- Dynamic Arrays, INDEX-MATCH and statistics recap in Lecture 37 are bridge/reuse, not duplicated standalone lessons.\n\n## QA findings / source boundaries\n- Power View and some Map/Power Pivot behavior are environment/version dependent.\n- Lecture 34 DISTINCTCOUNT screenshot is labeled “Count Sales” but counts distinct SalesRep values; logged as a presentation/metric-label issue.\n- Lecture 33 detailed Ogive workflow says Scatter with Straight Lines, while its summary wording later says line charts; logged as SOURCE INCONSISTENCY.\n- Survival screenshots contain statistical test names not explained by the source; no lessons are invented for them.\n- Macro productivity/error-reduction percentages are unsourced inside the course file and excluded from assessment.\n- Lecture 37 AI tool/vendor descriptions are treated as a time-sensitive source snapshot.\n- Lecture 38 says Top 40 while listing more action lines with duplicates; deduplicated for teaching. F11 PivotTable description is preserved only as a source issue and excluded from assessment.\n- Lectures 30/34/35/36 practical assessments reference companion Excel files that were not supplied; faithful practical recreation remains blocked.\n\n## Assessment gate\nPractice / Week Exam / Excel Final production remains **LOCKED** until Week 3 Study + Source Trace + local visual QA are approved.\n'''
