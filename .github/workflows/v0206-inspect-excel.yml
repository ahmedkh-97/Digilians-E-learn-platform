name: Inspect Excel Learning Structure

on:
  push:
    branches:
      - feature/v0.20.6-excel-week3-study
    paths:
      - .github/workflows/v0206-inspect-excel.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.20.6-excel-week3-study
      - name: Extract exact Week 2 examples
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('data/learning.json').read_text())
          excel=data['courses'][3]['tracks'][0]
          w2=excel['modules'][1]['study']
          snapshot={
            'productionStats':excel['productionStats'],
            'moduleShell':{k:v for k,v in excel['modules'][1].items() if k!='study'},
            'studyShell':{k:v for k,v in w2.items() if k not in ('sections','learningGroups')},
            'firstGroup':w2['learningGroups'][0],
            'firstSection':w2['sections'][0],
            'trackStudyGroupsTail':excel['studyGroups'][-2:]
          }
          Path('docs/excel-production/V0206-EXACT-EXAMPLE.json').write_text(json.dumps(snapshot,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit exact example
        run: |
          git config user.name "Ahmed Khaled"
          git config user.email "ahmedkph97@gmail.com"
          git add docs/excel-production/V0206-EXACT-EXAMPLE.json
          git commit -m "chore: capture exact Excel Week 2 production example"
          git push origin feature/v0.20.6-excel-week3-study
