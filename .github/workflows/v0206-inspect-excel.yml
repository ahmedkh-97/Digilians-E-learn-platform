name: Inspect Excel Learning Structure

on:
  push:
    branches:
      - feature/v0.20.6-excel-week3-study
    paths:
      - .github/workflows/v0206-inspect-excel.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.20.6-excel-week3-study
      - name: Discover Excel structure recursively
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data=json.loads(Path('data/learning.json').read_text())
          candidates=[]

          def walk(node,path='$',depth=0):
              if depth>12:
                  return
              if isinstance(node,dict):
                  ident=' '.join(str(node.get(k,'')) for k in ('id','title','name','track','course','label')).lower()
                  if 'excel' in ident:
                      slim={}
                      for k,v in node.items():
                          if isinstance(v,(str,int,float,bool)) or v is None:
                              slim[k]=v
                          elif isinstance(v,list):
                              slim[k]=f'<list:{len(v)}>'
                          elif isinstance(v,dict):
                              slim[k]=f'<dict:{len(v)}>'
                      candidates.append({'path':path,'keys':list(node.keys()),'summary':slim})
                  for k,v in node.items():
                      if isinstance(v,(dict,list)):
                          walk(v,f'{path}.{k}',depth+1)
              elif isinstance(node,list):
                  for i,v in enumerate(node):
                      if isinstance(v,(dict,list)):
                          walk(v,f'{path}[{i}]',depth+1)

          walk(data)
          snapshot={
            'topLevelType':type(data).__name__,
            'topLevelKeys':list(data.keys()) if isinstance(data,dict) else None,
            'candidateCount':len(candidates),
            'excelCandidates':candidates[:80]
          }
          Path('docs/excel-production/V0206-STRUCTURE-SNAPSHOT.json').write_text(json.dumps(snapshot,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(snapshot,ensure_ascii=False,indent=2)[:20000])
          PY
      - name: Commit snapshot
        run: |
          git config user.name "Ahmed Khaled"
          git config user.email "ahmedkph97@gmail.com"
          git add docs/excel-production/V0206-STRUCTURE-SNAPSHOT.json
          git commit -m "chore: inspect Excel Week 3 production structure"
          git push origin feature/v0.20.6-excel-week3-study
