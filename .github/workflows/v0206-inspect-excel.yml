name: Inspect Excel Learning Structure

on:
  push:
    branches:
      - feature/v0.20.6-excel-week3-study
    paths:
      - .github/workflows/v0206-inspect-excel.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.20.6-excel-week3-study
      - name: Extract focused Week 2 schema snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data=json.loads(Path('data/learning.json').read_text())
          excel=data['courses'][3]['tracks'][0]
          module=excel['modules'][1]
          study=module['study']
          section=study['sections'][0]
          group=study['learningGroups'][0]

          def shape(v,depth=0):
              if depth>3:
                  return '<depth-limit>'
              if isinstance(v,dict):
                  return {k:shape(x,depth+1) for k,x in v.items()}
              if isinstance(v,list):
                  if len(v)<=6:
                      return [shape(x,depth+1) for x in v]
                  return [shape(x,depth+1) for x in v[:2]]+[f'<... {len(v)-4} omitted ...>']+[shape(x,depth+1) for x in v[-2:]]
              return v

          snapshot={
            'excelKeys':list(excel.keys()),
            'description':excel.get('description'),
            'productionStats':excel.get('productionStats'),
            'moduleCount':len(excel.get('modules',[])),
            'studyGroupCount':len(excel.get('studyGroups',[])),
            'week2Module':shape(module),
            'week2FirstSection':shape(section),
            'week2FirstLearningGroup':shape(group),
            'trackStudyGroupsTail':shape(excel.get('studyGroups',[])[-3:])
          }
          Path('docs/excel-production/V0206-STRUCTURE-SNAPSHOT.json').write_text(json.dumps(snapshot,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(snapshot,ensure_ascii=False,indent=2)[:30000])
          PY
      - name: Commit snapshot
        run: |
          git config user.name "Ahmed Khaled"
          git config user.email "ahmedkph97@gmail.com"
          git add docs/excel-production/V0206-STRUCTURE-SNAPSHOT.json
          git commit -m "chore: focus Excel Week 3 production schema"
          git push origin feature/v0.20.6-excel-week3-study
