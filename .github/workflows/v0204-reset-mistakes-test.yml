name: V0.20.4 Reset My Mistakes Test

on:
  push:
    branches:
      - feature/v0.20.4-reset-my-mistakes

permissions:
  contents: read

jobs:
  test-reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.20.4-reset-my-mistakes
      - name: Run reset regression test
        run: node --test tests/reset-mistakes.test.mjs
