name: V0.22.4 PL-300 Release Validation

on:
  push:
    branches:
      - hotfix/v0.22.4-pl300-preselect-dropdowns
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  release-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare V0.22.4 release identity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          previous='0.22.3'
          version='0.22.4'
          root=Path('.')

          (root/'VERSION.txt').write_text(version+'\n',encoding='utf-8')

          for relative in [
            'index.html',
            'assets/js/app.js',
            'assets/js/storage.js',
            'assets/js/analytics.js',
            'assets/js/update-manager.js'
          ]:
            path=root/relative
            text=path.read_text(encoding='utf-8').replace(previous,version)
            if relative=='assets/js/update-manager.js':
              text=text.replace('PL-300 Native Arabic 509/509','PL-300 Pre-entry Parts & Source Dropdowns')
            path.write_text(text,encoding='utf-8')

          changelog_path=root/'data/changelog.json'
          changelog=json.loads(changelog_path.read_text(encoding='utf-8'))
          release={
            'version':version,
            'title':'PL-300 Pre-entry Parts & Source Dropdowns',
            'date':'2026-09-05',
            'type':'fix',
            'summary':'Moves PL-300 mini-part selection before the question screen and converts the first source Answer Area to source-backed storage-mode dropdowns while preserving the complete 509-occurrence ranked study journey.',
            'highlights':[
              'Learners now choose a Domain → Section mini part before entering PL-300 questions instead of changing parts from inside the question screen.',
              'All mini parts stay bounded to 20 questions or fewer and together cover all 509 unique source occurrences.',
              'PL-300 Source 01 Question 1 now renders four source-backed dropdowns using only Import, DirectQuery, and Dual from the original answer evidence.',
              'Native controls remain fail-closed: dropdowns are rendered only when explicit source-backed choices exist; no synthetic distractors are introduced.',
              'The 509-occurrence source audit, Arabic explanation coverage, Answer Lock, Retry, Instant Feedback, ranking state, and My Mistakes integration remain protected.',
              'Release validation requires the V0.22.4 behavior gate, the exhaustive PL-300 audit, full Node regression, and pre-deploy gate before merge.'
            ]
          }
          changelog['latest']=version
          releases=[x for x in changelog.get('releases',[]) if x.get('version')!=version]
          changelog['releases']=[release,*releases]
          changelog_path.write_text(json.dumps(changelog,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: V0.22.4 PL-300 behavior gate
        run: node --test tests/v0224-pl300-preselect-dropdowns.test.mjs
      - name: Exhaustive PL-300 509 audit gate
        run: node --test tests/v0223-pl300-native-arabic-regression.test.mjs
      - name: Full Node regression
        run: node --test tests/*.test.mjs
      - name: Pre-deploy gate
        run: node tools/pre-deploy-check.mjs
      - name: Commit green V0.22.4 release identity
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet -- VERSION.txt index.html assets/js/app.js assets/js/storage.js assets/js/analytics.js assets/js/update-manager.js data/changelog.json; then
            echo "V0.22.4 release identity already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION.txt index.html assets/js/app.js assets/js/storage.js assets/js/analytics.js assets/js/update-manager.js data/changelog.json
          git diff --cached --check
          git commit -m "release: set V0.22.4 identity [skip release-prep]"
          git push
