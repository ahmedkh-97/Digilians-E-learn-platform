name: V0.22.5 PL-300 Native Choice Fidelity Repair

on:
  push:
    branches:
      - hotfix/v0.22.5-pl300-native-choice-fidelity

permissions:
  contents: write

jobs:
  native-choice-fidelity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm regression gate is RED before data repair
        shell: bash
        run: |
          set +e
          node --test tests/v0226-pl300-native-choice-fidelity.test.mjs > /tmp/v0226-red.log 2>&1
          status=$?
          set -e
          cat /tmp/v0226-red.log
          if [ "$status" -eq 0 ]; then
            echo "Expected the new native-choice fidelity gate to fail before the repair." >&2
            exit 1
          fi
      - name: Apply source-backed native choice pools
        run: python3 tools/v0226-pl300-native-choice-repair.py
      - name: Native choice fidelity GREEN gate
        run: node --test tests/v0226-pl300-native-choice-fidelity.test.mjs
      - name: PL-300 native and ranked regression
        run: >-
          node --test
          tests/pl300-native-dropdowns.test.mjs
          tests/v0224-pl300-preselect-dropdowns.test.mjs
          tests/pl300-native-source-practice.test.mjs
          tests/pl300-native-ranked-interaction.test.mjs
          tests/pl300-native-ranked-engine.test.mjs
          tests/pl300-native-ranked-results-mistakes.test.mjs
          tests/pl300-full-ranked-domain-coverage.test.mjs
          tests/pl300-source-answer-lock.test.mjs
          tests/pl300-source-practice-freeze-regression.test.mjs
          tests/pl300-source-practice-selection-guard.test.mjs
          tests/pl300-arabic-source-explanation.test.mjs
      - name: Exhaustive PL-300 509 audit gate
        run: node --test tests/v0223-pl300-native-arabic-regression.test.mjs tests/pl300-full-source-review.test.mjs tests/pl300-source-dedup-audit.test.mjs
      - name: Full Node regression
        run: node --test tests/*.test.mjs
      - name: Validate bounded data diff
        shell: bash
        run: |
          git diff --check
          changed=$(git diff --name-only | sort)
          printf '%s\n' "$changed"
          expected=$(printf '%s\n' \
            voucher/tracks/data-analysis/microsoft-pl-300/master-bank.json \
            voucher/tracks/data-analysis/microsoft-pl-300/source-01-review-bank.json \
            voucher/tracks/data-analysis/microsoft-pl-300/source-02-review-bank.json | sort)
          test "$changed" = "$expected"
      - name: Commit green source-backed data repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add voucher/tracks/data-analysis/microsoft-pl-300/source-01-review-bank.json \
                  voucher/tracks/data-analysis/microsoft-pl-300/source-02-review-bank.json \
                  voucher/tracks/data-analysis/microsoft-pl-300/master-bank.json
          git diff --cached --check
          git commit -m "fix: restore PL-300 source-backed native choices [skip ci]"
          git push
      - name: Pre-deploy gate on clean committed tree
        run: |
          test -z "$(git status --porcelain)"
          node tools/pre-deploy-check.mjs
