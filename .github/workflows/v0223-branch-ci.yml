name: V0.22.3 PL-300 Release Validation

on:
  push:
    branches:
      - release/v0.22.3-pl300-native-arabic-regression
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  release-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare V0.22.3 release identity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          version='0.22.3'
          root=Path('.')

          (root/'VERSION.txt').write_text(version+'\n',encoding='utf-8')

          index=root/'index.html'
          index_text=index.read_text(encoding='utf-8').replace('0.22.2',version)
          index.write_text(index_text,encoding='utf-8')

          app=root/'assets/js/app.js'
          app_text=app.read_text(encoding='utf-8').replace('0.22.2',version)
          app.write_text(app_text,encoding='utf-8')

          storage=root/'assets/js/storage.js'
          storage_text=storage.read_text(encoding='utf-8').replace('0.22.2',version)
          storage.write_text(storage_text,encoding='utf-8')

          update=root/'assets/js/update-manager.js'
          update_text=update.read_text(encoding='utf-8').replace('0.22.2',version)
          update_text=update_text.replace('PL-300 Study UX & Answer Lock','PL-300 Native Arabic 509/509')
          update.write_text(update_text,encoding='utf-8')

          changelog_path=root/'data/changelog.json'
          changelog=json.loads(changelog_path.read_text(encoding='utf-8'))
          release={
            'version':version,
            'title':'PL-300 Native Arabic 509/509',
            'date':'2026-09-05',
            'type':'feature',
            'summary':'Closes the PL-300 full-source learning regression with all 509 source occurrences preserved, 78 source-backed native structured interactions, Arabic-first feedback across all 509 occurrences, and release-safe validation without synthetic distractors.',
            'highlights':[
              'All 509 PL-300 source occurrences remain studyable: 369 from Source 01 and 140 from Source 02.',
              'The source journey is explicitly audited as 321 scored-text, 78 native-structured, and 110 source-reveal checkpoints; non-deterministic source-reveal items do not create fake objective accuracy.',
              'All 78 native structured items resolve to supported source-backed interactions: 71 text-fields, 5 Yes/No, 1 choice-fields, and 1 ordered-fields.',
              'Arabic explanation resolution covers 509/509 source occurrences while preserving original source explanation evidence.',
              'pl300-source-01-q164 remains intentionally visual-only instead of inventing missing question wording.',
              'Answer Lock, intentional Retry, Instant Feedback, navigator/filter state, My Mistakes integration, and source-backed response choices are preserved.',
              'The protected startup gzip budget remains capped at 450 KB; the release must pass targeted PL-300, full Node regression, and pre-deploy gates before merge.'
            ]
          }
          changelog['latest']=version
          releases=[x for x in changelog.get('releases',[]) if x.get('version')!=version]
          changelog['releases']=[release,*releases]
          changelog_path.write_text(json.dumps(changelog,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: V0.22.3 exhaustive PL-300 gate
        run: node --test tests/v0223-pl300-native-arabic-regression.test.mjs
      - name: Full Node regression
        run: node --test tests/*.test.mjs
      - name: Pre-deploy gate
        run: node tools/pre-deploy-check.mjs
      - name: Commit green release identity
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet -- VERSION.txt index.html assets/js/app.js assets/js/storage.js assets/js/update-manager.js data/changelog.json; then
            echo "Release identity already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION.txt index.html assets/js/app.js assets/js/storage.js assets/js/update-manager.js data/changelog.json
          git commit -m "release: set V0.22.3 identity [skip release-prep]"
          git push
